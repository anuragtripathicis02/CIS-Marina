services:
  - type: web
    name: yacht-api
    env: node
    plan: free
    buildCommand: bash ./render-build.sh
    startCommand: cd apps/api && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "https://your-vercel-frontend.vercel.app" # Ise apne vercel URL se replace karein
      - key: DATABASE_URL
        fromDatabase:
          name: yacht-db
          property: connectionString
      - key: REDIS_HOST
        value: "localhost" # Agar redis use nahi kar rahe toh ignore karein

databases:
  - name: yacht-db
    databaseName: yacht_platform_db
    user: yacht_admin
    plan: free
