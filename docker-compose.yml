version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: yacht_platform_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: yacht_secret_pass
      MYSQL_DATABASE: yacht_platform_db
      MYSQL_USER: yacht_admin
      MYSQL_PASSWORD: yacht_secret_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yacht_platform_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
