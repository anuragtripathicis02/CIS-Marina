version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yacht_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: yacht_admin
      POSTGRES_PASSWORD: yacht_secret_pass
      POSTGRES_DB: yacht_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yacht_admin -d yacht_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yacht_platform_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
